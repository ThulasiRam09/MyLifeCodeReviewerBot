services:
  - type: web
    name: mylife-code-reviewer
    env: python
    buildCommand: cd frontend && npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: REVIEWER_MODEL
        value: gemini-2.5-flash
      - key: PYTHON_VERSION
        value: 3.11.9
